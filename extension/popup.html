<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab Audio Recorder</title>
    <style>
      body { font: 13px system-ui, sans-serif; margin: 0; padding: 12px; width: 250px; }
      h1 { font-size: 13px; margin: 0 0 8px; }
      p { margin: 0 0 8px; color: #555; }
      button { width: 100%; padding: 7px; margin-bottom: 6px; }
      .hint { color: #666; white-space: pre-wrap; min-height: 14px; margin: 0; }
      .err { color: #b00; }
    </style>
  </head>
  <body>
    <h1>Tab Audio Recorder</h1>
    <p id="status">Checking…</p>
    <button id="start" hidden>Start recording</button>
    <button id="stop" hidden>Stop recording</button>
    <button id="folder">Open recorder page…</button>
    <p class="hint" id="hint"></p>
    <script src="popup.js"></script>
  </body>
</html>
