<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Audio Recorder</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 32px auto; padding: 0 16px; }
      h1 { font-size: 18px; margin-bottom: 4px; }
      .muted { color: #666; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin: 14px 0; }
      .rec { border-color: #c00; }
      button { padding: 8px 14px; margin-right: 8px; }
      ol { padding-left: 22px; }
      li { margin-bottom: 6px; }
      li b { font-weight: 600; }
      .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #c00; margin-right: 6px; }
      .err { color: #b00; }
    </style>
  </head>
  <body>
    <h1><span class="dot" id="dot" hidden></span>Tab Audio Recorder</h1>
    <p class="muted" id="status">Checking…</p>

    <div class="card" id="folderCard">
      <div><b>Save folder</b></div>
      <p class="muted" id="folderName">No folder chosen yet.</p>
      <button id="pick">Choose folder…</button>
      <span class="muted">Asked once; every MP3 is written there.</span>
    </div>

    <div class="card" id="sessionCard" hidden>
      <div><b>Recording</b></div>
      <p class="muted" id="sessionInfo"></p>
      <ol id="files"></ol>
    </div>

    <p class="err" id="hint"></p>

    <script type="module" src="recorder.js"></script>
  </body>
</html>
